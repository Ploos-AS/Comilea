name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Fetch pinned Klaus 6502 functional image
        run: |
          curl --fail --location --retry 3 \
            -o /tmp/6502_functional_test.bin \
            https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/7954e2dbb49c469ea286070bf46cdd71aeb29e4b/bin_files/6502_functional_test.bin
          test "$(wc -c < /tmp/6502_functional_test.bin)" -eq 65536
          test "$(git hash-object /tmp/6502_functional_test.bin)" = c9a35e1d6bd2e7d85844da2abf7034d5ed820e6e
      - name: Klaus 6502 functional conformance
        run: cargo run -p comilea-core --example klaus6502 -- /tmp/6502_functional_test.bin
      - name: Probe pinned AS65 decimal build
        run: |
          curl --fail --location --retry 3 \
            -o /tmp/as65_142.zip \
            https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/7954e2dbb49c469ea286070bf46cdd71aeb29e4b/as65_142.zip
          test "$(git hash-object /tmp/as65_142.zip)" = 5bf94922a08bc4ea8739d91ddb98b6fce3cbf434
          unzip -l /tmp/as65_142.zip
          unzip -q /tmp/as65_142.zip -d /tmp/as65
          find /tmp/as65 -maxdepth 3 -type f -print
          chmod +x /tmp/as65/as65
          curl --fail --location --retry 3 \
            -o /tmp/6502_decimal_test.a65 \
            https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/7954e2dbb49c469ea286070bf46cdd71aeb29e4b/6502_decimal_test.a65
          test "$(git hash-object /tmp/6502_decimal_test.a65)" = 7a76ad14c8611248814a551fb35b8a60c9c141a5
          cd /tmp
          /tmp/as65/as65 -l 6502_decimal_test.a65
          ls -l /tmp/6502_decimal_test.*
          file /tmp/6502_decimal_test.*
          test "$(wc -c < /tmp/6502_decimal_test.bin)" -eq 234
      - name: Bruce Clark NMOS decimal conformance
        run: cargo run -p comilea-core --example decimal6502 -- /tmp/6502_decimal_test.bin
      - name: Fetch pinned SingleStep representative vectors
        run: |
          base=https://raw.githubusercontent.com/SingleStepTests/65x02/2f6980a2d95757486c7bee24355c360e40e2a224/6502/v1
          while read -r opcode blob; do
            curl --fail --location --retry 3 -o "/tmp/$opcode.json" "$base/$opcode.json"
            test "$(git hash-object "/tmp/$opcode.json")" = "$blob"
          done <<'EOF'
          a9 56b3774c21c9a13114879dd60c66390355365198
          69 95dd858e61aef6a87ad9909e4f9861a099b26899
          e9 756daaa6d4de76d2253c79c9fe09655d4e5b49e8
          d0 c8742ac30342b111b3453a498c043423b95d0193
          48 de3556c08bfbf47a62e1e17daa1d4a7c5f12774b
          68 7dd69146268540a4f3e60ec46fabe5e8abea0ab4
          06 c5a2a542e0856462152dcd6e9b39a8e7069d2c93
          b1 d161c5b41d8ff50e262798907ac36eea9f4ebd3e
          00 17b96cfd880f65c8f97c76becd146ac083f8b6b6
          40 90534ecfa9514b158b75298a0b5f3116314e33b7
          01 3d27dfe43df7ab4aa99cdc3bd0b7b4f8bdbf0ad1
          05 a84e67d36108a87f2346ef586b8dfb6dcc4a13a5
          08 1cae6e6d80ed449ee73e315704365cab55ff2275
          09 46f9581a3bc5da6da729aa833fca297b683e00b5
          0a c4fbdae1cf4d46f9989725a19062682960915c01
          0d c15ce08d6b5c6840dfc7bc44f1c86aaf5c5bff38
          0e 5b595b41b61edb16eede671f65868cb4434b8794
          10 ef7cf66c07940e59c5c1c08628ae417d600cbe52
          11 ea857ffa12ff043be0f24605777c00cabf60c52c
          15 2e8b3bcc0ef1a31b6f045e8c5879f44c66444b03
          16 ee333ecef18ef81557c59200fd72b3ea914bf892
          18 7dfd3936fb9d7c117b5ac1ceb9f82592da1cff3a
          19 c36345f727ca3615afe0f7e40a9c463ecd7a74aa
          1d 0a954ae34e265ca7f1138327630e27caea3bf28b
          1e c28027d76d0ec5e6d45e832f1c3765a4d8b0ad14
          20 74bfc1d58b83c2542b0b947456a027c4a22f1d38
          21 c095a154c22688857b91321b9fa83f59ee4a78ec
          24 92308f5de474e4fdea83472f33ac654340bd4857
          25 cbe37655be7c817843d12455e33bf4c59c5df879
          26 c9f0e6605e628a20221353508eed0e23e34d0f46
          EOF
      - name: SingleStep representative conformance
        run: |
          for opcode in a9 69 e9 d0 48 68 06 b1 00 40 01 05 08 09 0a 0d 0e 10 11 15 16 18 19 1d 1e 20 21 24 25 26; do
            echo "== opcode $opcode =="
            cargo run -p comilea-core --example singlestep6502 -- "/tmp/$opcode.json"
          done
      - name: Headless smoke test
        run: cargo run -p comilea-cli -- --cycles 1000
