name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Upload formatted core
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-core
          path: crates/comilea-core/src/lib.rs
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Headless smoke test
        run: cargo run -p comilea-cli -- --cycles 1000
