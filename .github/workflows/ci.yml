      - name: SingleStep representative conformance
        run: |
          for opcode in a9 69 e9 d0 48 68 06 b1 00 40 01 05 08 09 0a 0d 0e 10 11 15 16 18 19 1d 1e 20 21 24 25 26 28 29 2a 2c 2d 2e 30 31 35 36 38 39 3d 3e 41 45 46 49 4a 4c 4d 4e 50 51 55 56 58 59 5d 5e; do
            echo "== opcode $opcode =="
            cargo run -p comilea-core --example singlestep6502 -- "/tmp/$opcode.json"
          done
      - name: Headless smoke test
        run: cargo run -p comilea-cli -- --cycles 1000
